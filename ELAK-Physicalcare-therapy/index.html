<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELAK · 诊所</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f3ecdf;
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 场景图：铺满整个页面（超出部分裁切，保持比例不拉伸） */
    .scene {
      position: fixed;
      left: 50%;
      top: 50%;
      width: max(100vw, calc(100vh * 1507 / 1044));
      height: max(100vh, calc(100vw * 1044 / 1507));
      transform: translate(-50%, -50%);
      transform-origin: 50% 50%;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .scene.is-zooming { pointer-events: none; }

    /* 放大时压暗的全屏遮罩 */
    .scene-fade {
      position: fixed;
      inset: 0;
      background: #0b0b0f;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    .scene-fade.is-on { opacity: 1; }
    .scene img { width: 100%; height: 100%; display: block; }

    /* 连接线 */
    .link {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    @keyframes linkDash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -31; }
    }
    .link-flow { animation: linkDash 1.4s linear infinite; }
    .link-flow--rev { animation-direction: reverse; }

    /* 热区（默认透明，悬停高亮） */
    .hotspot {
      position: absolute;
      border-radius: 16px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
    }
    .hotspot:hover,
    .hotspot:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.18),
        0 0 46px rgba(255, 196, 120, 0.55);
    }
    /* 轻微脉冲提示可点击 */
    .hotspot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      pointer-events: none;
      animation: pulse 2.8s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.45); }
      70% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* 热区位置（相对场景图 1507×1044 的比例） */
    .hotspot--monitor { left: 75.5%; top: 31.5%; width: 16.5%; height: 21%; }
    .hotspot--phone   { left: 31.5%; top: 31%;   width: 9%;   height: 14%; }
  </style>
</head>
<body>
  <div class="scene">
    <img src="assets/cover.png" alt="诊所场景" draggable="false" />

    <!-- 患者手机 ↔ 康复师电脑 的连接线（双向） -->
    <svg class="link" viewBox="0 0 1507 1044" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7ff0e4" />
          <stop offset="1" stop-color="#7fb4ff" />
        </linearGradient>
        <filter id="linkGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4.5" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- 去程（手机 → 电脑） -->
      <path d="M 552 392 C 700 112 1120 92 1245 404" fill="none"
        stroke="url(#linkGrad)" stroke-width="7" stroke-linecap="round"
        opacity="0.10" filter="url(#linkGlow)" />
      <path d="M 552 392 C 700 112 1120 92 1245 404" fill="none"
        stroke="url(#linkGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      <path class="link-flow" d="M 552 392 C 700 112 1120 92 1245 404" fill="none"
        stroke="#e4fdf8" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="1.5 14" opacity="0.75" />

      <!-- 回程（电脑 → 手机） -->
      <path d="M 552 392 C 690 96 1130 76 1245 404" fill="none"
        stroke="url(#linkGrad)" stroke-width="7" stroke-linecap="round"
        opacity="0.10" filter="url(#linkGlow)" />
      <path d="M 552 392 C 690 96 1130 76 1245 404" fill="none"
        stroke="url(#linkGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      <path class="link-flow link-flow--rev" d="M 552 392 C 690 96 1130 76 1245 404" fill="none"
        stroke="#eaf0ff" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="1.5 14" opacity="0.75" />

      <!-- 数据包 -->
      <circle r="3" fill="#eafffb" filter="url(#linkGlow)">
        <animateMotion dur="3s" repeatCount="indefinite"
          path="M 552 392 C 700 112 1120 92 1245 404" />
      </circle>
      <circle r="3" fill="#eaf1ff" filter="url(#linkGlow)">
        <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"
          path="M 1245 404 C 1130 76 690 96 552 392" />
      </circle>

      <!-- 端点节点 -->
      <g filter="url(#linkGlow)">
        <circle cx="552" cy="392" r="3" fill="#eafffb" />
        <circle cx="552" cy="392" r="3" fill="none" stroke="#9ff6ea" stroke-width="1.5">
          <animate attributeName="r" values="3;13" dur="2.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="1245" cy="404" r="3" fill="#eaf1ff" />
        <circle cx="1245" cy="404" r="3" fill="none" stroke="#a9c0ff" stroke-width="1.5">
          <animate attributeName="r" values="3;13" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
        </circle>
      </g>
    </svg>

    <a class="hotspot hotspot--monitor" href="therapist/dashboard.html"
      aria-label="进入康复师端"></a>

    <a class="hotspot hotspot--phone" href="patient/index.html"
      aria-label="进入患者端"></a>
  </div>

  <div class="scene-fade" id="scene-fade"></div>

  <script>
    const scene = document.querySelector(".scene");
    let zooming = false;

    document.querySelectorAll(".hotspot").forEach((hs) => {
      hs.addEventListener("click", (e) => {
        e.preventDefault();
        if (zooming) return;
        zooming = true;
        scene.classList.add("is-zooming");

        const W = scene.offsetWidth;
        const H = scene.offsetHeight;
        // 热区中心在图中的比例位置
        const ox = (hs.offsetLeft + hs.offsetWidth / 2) / W;
        const oy = (hs.offsetTop + hs.offsetHeight / 2) / H;

        // 手机更小 → 放大倍数更大
        const k = hs.classList.contains("hotspot--phone") ? 6 : 3;
        // 让该点移动到屏幕中心
        const tx = -k * W * (ox - 0.5);
        const ty = -k * H * (oy - 0.5);

        scene.style.transform =
          `translate(-50%, -50%) translate(${tx}px, ${ty}px) scale(${k})`;
        document.getElementById("scene-fade").classList.add("is-on");

        const target = hs.getAttribute("href");
        setTimeout(() => { window.location.href = target; }, 900);
      });
    });

    // 从目标页返回时复位
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) {
        zooming = false;
        scene.classList.remove("is-zooming");
        scene.style.transform = "";
        document.getElementById("scene-fade").classList.remove("is-on");
      }
    });
  </script>
</body>
</html>
