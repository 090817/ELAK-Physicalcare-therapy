<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepHeal Loop · 康复师数据看板</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="page-fade" style="position:fixed;inset:0;background:#0b0b0f;z-index:99999;pointer-events:none;opacity:1;transition:opacity .55s ease"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__head">
        <h1 class="large-title">患者</h1>
        <label class="searchbar">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"
              d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4l4.2 4.3 1.4-1.4-4.3-4.2A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/>
          </svg>
          <input id="search" type="text" placeholder="姓名 / MRN / 编号 / 病症" autocomplete="off" />
        </label>
      </div>
      <ul id="patient-list" class="plist"></ul>
    </aside>

    <main class="content" id="detail">
      <div class="placeholder">选择一位患者查看数据</div>
    </main>
  </div>

  <script type="module" src="./js/main.js?v=6"></script>
  <script>
    addEventListener("load", function () {
      var f = document.getElementById("page-fade");
      if (!f) return;
      requestAnimationFrame(function () { f.style.opacity = "0"; });
      setTimeout(function () { f.remove(); }, 700);
    });
  </script>
</body>
</html>
