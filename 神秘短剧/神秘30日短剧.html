// ============================================================
//  交互逻辑
// ============================================================
const chatArea = document.getElementById('chatArea');
const btnNext = document.getElementById('btnNext');
const btnPrev = document.getElementById('btnPrev');
const epBadge = document.getElementById('epBadge');
const dayBadge = document.getElementById('dayBadge');
const epTitle = document.getElementById('epTitle');
const epScene = document.getElementById('epScene');
const progressFill = document.getElementById('progressFill');

let currentEp = 0;       // 当前集索引 0-30
let currentLine = 0;     // 当前集内已显示到第几句
let isFinished = false;  // 当前集是否全部显示完

function renderEpisode(epIndex) {
  const ep = EPISODES[epIndex];
  currentEp = epIndex;
  currentLine = 0;
  isFinished = false;
  chatArea.innerHTML = '';
  epBadge.textContent = '第 ' + ep.ep + ' 集';
  dayBadge.textContent = ep.day;
  epTitle.textContent = ep.title;
  epScene.textContent = ep.scene;
  progressFill.style.width = '0%';
  btnPrev.disabled = (epIndex === 0);
  btnNext.disabled = false;
  btnNext.textContent = '点击继续 ▶';
  chatArea.scrollTop = 0;

  // 自动显示第一句
  showNextLine();
}

function showNextLine() {
  const ep = EPISODES[currentEp];

  // 如果已经全部显示完
  if (currentLine >= ep.dialogues.length) {
    isFinished = true;
    btnNext.textContent = currentEp < EPISODES.length - 1 ? '下一集 ▶' : '已完结 🎬';
    if (currentEp >= EPISODES.length - 1) {
      btnNext.disabled = true;
      const tip = document.createElement('div');
      tip.className = 'end-tip';
      tip.innerHTML = '<span class="big">🎬 全剧终</span>感谢观看<br>《康复训练·霸总篇》<br>30天，从轮椅到深蹲五十个';
      chatArea.appendChild(tip);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    return;
  }

  const line = ep.dialogues[currentLine];
  const bubble = document.createElement('div');

  if (line.s === '旁白') {
    bubble.className = 'bubble narrator';
    bubble.textContent = line.t;
  } else {
    const isMe = line.me === true;
    bubble.className = 'bubble ' + (isMe ? 'right' : 'left');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = line.s;
    bubble.appendChild(nameSpan);
    bubble.appendChild(document.createTextNode(line.t));
  }

  chatArea.appendChild(bubble);
  currentLine++;

  // 更新进度条
  const progress = (currentLine / ep.dialogues.length) * 100;
  progressFill.style.width = progress + '%';

  // 滚动到底部
  chatArea.scrollTop = chatArea.scrollHeight;

  // 如果全部显示完
  if (currentLine >= ep.dialogues.length) {
    isFinished = true;
    if (currentEp < EPISODES.length - 1) {
      btnNext.textContent = '下一集 ▶';
    } else {
      btnNext.textContent = '已完结 🎬';
      btnNext.disabled = true;
      const tip = document.createElement('div');
      tip.className = 'end-tip';
      tip.innerHTML = '<span class="big">🎬 全剧终</span>感谢观看<br>《康复训练·霸总篇》<br>30天，从轮椅到深蹲五十个';
      chatArea.appendChild(tip);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  }
}

// 点击继续
btnNext.addEventListener('click', function () {
  if (!isFinished) {
    showNextLine();
  } else {
    // 进入下一集
    if (currentEp < EPISODES.length - 1) {
      renderEpisode(currentEp + 1);
    }
  }
});

// 上一集
btnPrev.addEventListener('click', function () {
  if (currentEp > 0) {
    renderEpisode(currentEp - 1);
  }
});

// 初始化
renderEpisode(0);
</script>
