<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELAK · 患者详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=20" />
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="page-fade" style="position:fixed;inset:0;background:#2a241c;z-index:99999;pointer-events:none;opacity:1;transition:opacity .55s ease"></div>
  <div class="content">
    <a class="backlink" href="./patients.html">← 返回患者列表</a>
    <main id="detail">
      <div class="placeholder">加载中…</div>
    </main>
  </div>

  <script type="module" src="./js/main.js?v=20"></script>
  <script>
    addEventListener("load", function () {
      var f = document.getElementById("page-fade");
      if (!f) return;
      requestAnimationFrame(function () { f.style.opacity = "0"; });
      setTimeout(function () { f.remove(); }, 700);
    });
  </script>
</body>
</html>
