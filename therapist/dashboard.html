<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="./css/style.css?v=23" />

  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="page-fade" style="position:fixed;inset:0;background:#2a241c;z-index:99999;pointer-events:none;opacity:1;transition:opacity .55s ease"></div>
  <div class="content">
    <header class="site-head">
      <span class="brand"><img class="mark" src="../physio-quest/elak-logo.png" alt="" /> ELAK</span>
      <a class="backlink backlink--x" href="./patients.html" aria-label="返回患者列表" title="返回患者列表">

          <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </a>
    </header>
    <main id="detail">
      <div class="placeholder">加载中…</div>
    </main>
  </div>

  <script type="module" src="./js/main.js?v=23"></script>
  <script>
    addEventListener("load", function () {
      var f = document.getElementById("page-fade");
      if (!f) return;
      requestAnimationFrame(function () { f.style.opacity = "0"; });
      setTimeout(function () { f.remove(); }, 700);
    });
  </script>
